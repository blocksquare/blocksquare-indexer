### Price Tracking ###

type AssetPairPrice @entity {
  id: ID!
  assetPair: AssetPair!
  timestamp: Int!
  "Timestamp of the hour start (mightnight UTC) in seconds"
  hourStartTimestamp: Int! @index
  "Timestamp of the date start (mightnight UTC) in seconds"
  dayStartTimestamp: Int! @index
  blockNumber: Int!
  priceBI: BigInt!
  price: Float!
}

type AssetPair @entity {
  # ID is the pair of the two assets. Example: ETH/USD or BST/USD
  id: ID!
  latestPrice: Float!
  latestPriceBI: BigInt!
  updatedAt: Int!
  latestAggregatorAddress: Bytes! @index
  prices: [AssetPairPrice!]! @derivedFrom(field: "assetPair")
}

### Marketplace ###

# This is usually a marketplace operator
type CertifiedPartner {
  id: ID!
  chainId: Int!
  name: String! @index
  wallets: [Wallet!]! @derivedFrom(field: "certifiedPartner")
  whitelisted: [UserCertifiedPartner!]! @derivedFrom(field: "certifiedPartner")
  properties: [PropertyToken!]! @derivedFrom(field: "certifiedPartner")
}

type PropertyToken {
  id: ID!
  chainId: Int!
  contractAddress: Bytes! @index
  name: String!
  symbol: String!
  totalSupply: BigInt!
  totalBurnt: BigInt!
  totalTransfers: Int!
  totalHolders: Int!
  tokenValuation: BigInt!
  propertyValuation: BigInt! @index
  propertyValuationUpdateTimestamp: Int!
  propertyValuationCurrency: String!
  # The wallet of the certified partner that the property belongs too
  certifiedPartnerWallet: Wallet!
  streetLocation: String!
  geoLocation: String!
  lat: Float!
  lng: Float!
  countryCode: String!
  parcelNumber: String!
  kadastralMunicipality: String!
  buildingPart: Int!
  propertyType: String!
  ipfs: String!
  createdAt: Int!
  createdAtBlock: Int!
  creationTransaction: String!
  holders: [PropertyTokenHolder!]! @derivedFrom(field: "token")
  capitalStacks: [PropertyTokenCapitalStack!]! @derivedFrom(field: "property")
  oceanpointInformations: [OceanpointTokenInformation!]!
    @derivedFrom(field: "propertyToken")
  investments: [PropertyTokenInvestment!]! @derivedFrom(field: "propertyToken")
  trades: [PropertyTokenTrade!]! @derivedFrom(field: "propertyToken")
  totalPropertyTokenTraded: BigInt!
  totalValueTraded: BigInt!
  transfers: [PropertyTokenTransfer!]! @derivedFrom(field: "propertyToken")
  pendingRevenues: [PropertyTokenRevenue!]! @derivedFrom(field: "propertyToken")
  revenueClaims: [PropertyTokenRevenueClaim!]! @derivedFrom(field: "propertyToken")
  revenueDistributions: [PropertyTokenRevenueDistribution!]!
    @derivedFrom(field: "propertyToken")
  records: [PropertyTokenRecord!]! @derivedFrom(field: "propertyToken")
  certifiedPartner: CertifiedPartner!
  latestOffering: PropertyTokenOffering!
  offerings: [PropertyTokenOffering!]! @derivedFrom(field: "property")
  apy: Float!
  currentYearApy: Float!
  weightedNAVDeviation: Float!
}

# PropertyTokenId + WalletId
type PropertyTokenHolder {
  id: ID!
  chainId: Int!
