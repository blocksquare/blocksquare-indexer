### Helper ###

type Global {
  # Always 0
  id: ID!
  activePropertiesCount: Int!
  activePropertiesTotalValuation: BigInt!
  activePropertiesCountryCount: Int!
}

enum PropertyStakingPoolType {
    COMMUNITY
