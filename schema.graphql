}

type User {
  id: ID!
  chainId: Int!
  wallets: [Wallet!]! @derivedFrom(field: "user")
  certifiedPartners: [UserCertifiedPartner!]! @derivedFrom(field: "user")
}

type UserCertifiedPartner {
  id: ID! # Set to `${user.id}-${certifiedPartner.id}`
  chainId: Int!
