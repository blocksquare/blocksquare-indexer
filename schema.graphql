    @derivedFrom(field: "from")
  receveiverPropertyTokenTransfers: [PropertyTokenTransfer!]!
    @derivedFrom(field: "to")
  propertyInvestments: [PropertyTokenInvestment!]! @derivedFrom(field: "wallet")
  pendingRevenues: [PropertyTokenRevenue!]! @derivedFrom(field: "wallet")
  revenueClaims: [PropertyTokenRevenueClaim!]! @derivedFrom(field: "wallet")
}

### Oceanpoint ###

type StakingPool {
  id: ID!
  chainId: Int!
  issuedAmount: BigInt!
  stakedAmount: BigInt!
  ratio: BigDecimal!
  currentAmount: BigInt!
  totalDepositAmount: BigInt!
  totalRewards: BigInt!
  totalWithdrawAmount: BigInt!
  positions: [StakingPoolPosition!]! @derivedFrom(field: "pool")
  historyRecords: [StakingPoolRecord!]! @derivedFrom(field: "pool")
}

type StakingPoolPosition {
  id: ID!
  chainId: Int!
  pool: StakingPool!
  wallet: Wallet!
  stakedAmount: BigInt!
  issuedAmount: BigInt! # Multiply this with the current ratio in the pool to get the actual amount
  lockedUntil: Int!
}

type OceanpointTokenInformation {
  id: ID!
  chainId: Int!
  propertyToken: PropertyToken!
  propertyStakingPool: PropertyStakingPool!
  propertyStakingPoolType: PropertyStakingPoolType!
  propertyStakingPoolPositions: [PropertyStakingPoolPosition!]!
    @derivedFrom(field: "tokenInformation")
  valuation: BigInt!
  valuationFrom: Bytes!
  valuePerBSPT: BigInt!
  apy: BigInt!
}

type PropertyStakingPool {
  id: ID!
  chainId: Int!
  issuedAmount: BigInt!
  currentAmount: BigInt!
  totalRewards: BigInt!
  totalRewardsPaid: BigInt!
  currentRewards: BigInt!
  tvl: BigInt!
  tokenInformations: [OceanpointTokenInformation!]!
    @derivedFrom(field: "propertyStakingPool")
  positions: [PropertyStakingPoolPosition!]! @derivedFrom(field: "pool")
  historyRecords: [PropertyStakingPoolRecord!]! @derivedFrom(field: "pool")
}

type TokenDeposit {
  id: ID!
  stakingPoolPosition: PropertyStakingPoolPosition!
  tokenInformation: OceanpointTokenInformation!
  issuedAmount: BigInt!
  stakedAmount: BigInt!
  valuePerBSPT: BigInt!
  lockedUntil: Int!
  stakedValue: BigInt!
}

type PropertyStakingPoolPosition {
  id: ID!
  chainId: Int!
  pool: PropertyStakingPool!
  tokenInformation: OceanpointTokenInformation!
  deposits: [TokenDeposit!]! @derivedFrom(field: "stakingPoolPosition")
  wallet: Wallet!
  totalIssuedAmount: BigInt!
  totalStakedAmount: BigInt!
  totalStakedValue: BigInt!
}

type Reward {
  id: ID!
  chainId: Int!
}

type MarketplacePool {
  id: ID!
  chainId: Int!
  contractAddress: Bytes! @index
  # If the pool reached the full amount of sBST
  capped: Boolean!
  # Initial amount of sBST that the CP add to the pool
  certifiedPartnerCollateralAmount: BigInt!
  # Triggered by owner to allow CP to collect his collateral
  certifiedPartnerCanWithdraw: Boolean!
  certifiedPartnerIdentifier: String!
  certifiedPartnerUrl: String!
  certifiedPartnerWallet: String!
  certifiedPartnerPoolPosition: MarketplacePoolPosition!
  bsWallet: String!
  # Duration in seconds of how long is the investment period
  duration: Int!
  # Duration in seconds of how long users are locked
  lockPeriod: Int!
  # Users can't withdraw before timestamp x
  lockedUntil: Int!
  # sBST staked in the pool
  stakedAmount: BigInt!
  totalDepositAmount: BigInt!
  totalWithdrawAmount: BigInt!
  # Starting max amount of sBST that users can invest (increase over time)
  startMaxPledge: BigInt!
  # Start timestamp when users are allowed to invest
  startTime: Int!
  tokenName: String!
  tokenSymbol: String!
  totalRewardsAdded: BigInt!
  totalRewardsClaimed: BigInt!
  # Internal token amount to track positons.
  vAmount: BigInt!
  positions: [MarketplacePoolPosition!]! @derivedFrom(field: "pool")
  stats: [MarketplacePoolRecord!]! @derivedFrom(field: "pool")
  isCpCollateralLiquidated: Boolean!
  cpCollateralLiquidatedAt: Int!
}

type MarketplacePoolPosition {
  id: ID!
  chainId: Int!
  pool: MarketplacePool!
  wallet: Wallet!
  # sBST stake in the pool
  stakedAmount: BigInt!
  # Internal token amount to track positons.
  vAmount: BigInt!
  rewards: BigInt!
}

