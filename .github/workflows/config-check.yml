name: Config Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - release

jobs:
  config-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check for config generation commit
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 10
            });

            const hasConfigCommit = commits.data.some(commit =>
              commit.commit.message.includes('generate config.yaml') &&
              commit.commit.author.name === 'github-actions[bot]'
            );

            if (!hasConfigCommit) {
              core.setFailed('Config generation required. Comment `/generate-config` to generate.');
            } else {
              core.info('✅ Config generated successfully');
            }
