name: Config Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - release

jobs:
  config-check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            return {
              baseRef: pr.data.base.ref,
              number: pr.data.number
            };

      - name: Check for recent config generation commit
        id: check-commit
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 5
            });

            // Check if any recent commit is a config generation commit
            const hasConfigCommit = commits.data.some(commit =>
              commit.commit.message.includes('generate config.yaml') &&
              commit.commit.author.name === 'github-actions[bot]'
            );

            return hasConfigCommit;

      - name: Create check with status
        id: create-check
        uses: actions/github-script@v7
        with:
          script: |
            const hasConfigCommit = ${{ steps.check-commit.outputs.result }};
            const prDetails = ${{ steps.pr.outputs.result }};

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Config Generation Required',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: hasConfigCommit ? 'success' : 'action_required',
              output: {
                title: hasConfigCommit
                  ? '✅ Config Generated'
                  : '⚠️ Config Generation Required',
                summary: hasConfigCommit
                  ? 'Config generated successfully'
                  : 'Comment `/generate-config` to generate config',
                text: hasConfigCommit
                  ? 'Config is up-to-date. New commits will require regeneration.'
                  : 'Comment `/generate-config` to generate the config file.'
              }
            });

            return hasConfigCommit;
          result-encoding: string

      - name: Comment on PR if config needed
        if: steps.create-check.outputs.result == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prDetails = ${{ steps.pr.outputs.result }};

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prDetails.number
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Config generation required')
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prDetails.number,
                body: '⚠️ **Config generation required**\n\nComment `/generate-config` to generate the config file.'
              });
            }
